[package]
name = "jellycord"
version = "0.1.6"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["DepriSheep"]
repository = "https://github.com/Vernoxvernax/JellyCord"

[dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
serenity = "0.12.4"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
config = "0.15.19"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.145"
chrono = "0.4.42"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["gzip"] }
