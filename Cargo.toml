[package]
name = "jellycord"
version = "0.1.6"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["DepriSheep"]
repository = "https://github.com/Vernoxvernax/JellyCord"

[dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
serenity = "0.12.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
config = "0.15.25"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
chrono = "0.4.45"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["gzip"] }
